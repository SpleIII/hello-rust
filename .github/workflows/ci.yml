name: Rust CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Проверка и сборка образа
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Подключить Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Кэш Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}

      - name: Проверить форматирование
        run: cargo fmt --check

      - name: Прогнать Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Выполнить тесты
        run: cargo test

      - name: Собрать release-сборку
        run: cargo build --release

      - name: Авторизоваться в GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Подготовить Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Собрать метаданные образа
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/spleiii/hello-rust
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Собрать и отправить образ
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Публикация релиза
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Создать релиз
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Образ в GHCR

            ```
            docker pull ghcr.io/spleiii/hello-rust:${{ github.ref_name }}
            docker run --rm ghcr.io/spleiii/hello-rust:${{ github.ref_name }}
            ```

            Тег `latest` двигается только при пуше в `main`.
